user nobody;
worker_rlimit_nofile 65535;
worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    server_names_hash_bucket_size 256;
    server_names_hash_max_size 1024;
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    
    server_tokens off;
    more_clear_headers Server;
    more_clear_headers 'X-Powered-By'; #désactiver la réponse PHP
    fastcgi_intercept_errors off; #Désactive les erreurs html

    # ✅ Redirige toutes les erreurs vers une page générique
    error_page 400 401 403 404 405 406 408 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 =404 /404.html;
    error_page 500 501 502 503 504 505 506 507 508 510 511 =500 /50x.html;

    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /usr/local/openresty/nginx/logs/access.log main buffer=16k flush=5s;  # ← ICI

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 3;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/x-font-ttf font/opentype image/svg+xml;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /usr/local/openresty/nginx/conf/domains/*/*.conf;
}
