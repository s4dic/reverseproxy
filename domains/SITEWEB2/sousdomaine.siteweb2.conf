# Configuration du serveur HTTPS pour sousdomaine.siteweb2.com, Attention Configuration avec htpasswd
server {
    listen 80;
    server_name sousdomaine.siteweb2.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sousdomaine.siteweb2.com;

    ssl_certificate /usr/local/openresty/nginx/conf/domains/siteweb2.com/certs/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/domains/siteweb2.com/certs/privkey.pem;

    include /usr/local/openresty/nginx/conf/snippets/ssl-params.conf;
    include /usr/local/openresty/nginx/conf/snippets/proxy-params.conf;

    # ✅ DÉSACTIVE le server_tokens d'OpenResty
    more_clear_headers 'Server';
    
    # Authentification
    auth_basic "Accès restreint";
    auth_basic_user_file /usr/local/openresty/nginx/conf/.htpasswd;

    # ✅ Intercepter la 401 avec error_page (AVANT les locations)
    error_page 401 = @error401;
    error_page 404 = @error404;
    error_page 500 502 503 504 = @error50x;

    # Handler pour 401
    location @error401 {
        internal;
        default_type text/html;
        return 401 '<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>401 Unauthorized</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>401 - Authentication Required</h1>
    <p>Access to this resource requires authentication.</p>
</body>
</html>';
    }

    # Handler pour 404
    location @error404 {
        internal;
        default_type text/html;
        return 404 '<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>404 Not Found</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>404 - Page Not Found</h1>
    <p>The requested resource could not be found.</p>
</body>
</html>';
    }

    # Handler pour 50x
    location @error50x {
        internal;
        default_type text/html;
        return 500 '<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Error</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Service Temporarily Unavailable</h1>
    <p>Please try again later.</p>
</body>
</html>';
    }

    location / {
        proxy_pass http://X.X.X.X:XXXX;
        #IP DE VOTRE CLIENT VPN VyOS, PORT DU WAF
        
        # Headers essentiels pour le WAF
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Transmission des cookies (Kibana en a besoin)
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        
        # Désactive l'auth basic pour le backend
        proxy_set_header Authorization "";
        
        # Support WebSocket (optionnel mais utile pour certaines applications web complexes)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
