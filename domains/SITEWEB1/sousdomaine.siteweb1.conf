# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name sousdomaine.siteweb1.com;
    return 301 https://$server_name$request_uri;
}

# Serveur HTTPS principal
server {
    listen 443 ssl;
    http2 on;
    server_name sousdomaine.siteweb1.com;

    # Certificats SSL
    ssl_certificate /usr/local/openresty/nginx/conf/domains/siteweb1.com/certs/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/domains/siteweb1.com/certs/privkey.pem;
    # Paramètres SSL
    include /usr/local/openresty/nginx/conf/snippets/ssl-params.conf;
    include /usr/local/openresty/nginx/conf/snippets/error-pages.conf;
    include /usr/local/openresty/nginx/conf/snippets/proxy-params.conf;

    # Authentification
    auth_basic "Accès restreint";
    auth_basic_user_file /usr/local/openresty/nginx/conf/.htpasswd;

    # Proxy vers le backend (uniquement pour /)
    # Pages d'erreur personnalisées
    location = /404.html {
        root /usr/local/openresty/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/local/openresty/nginx/html;
        internal;
    }

    location / {
        proxy_pass http://XX.XX.XX.XX:XXXX/;
        #IP DE VOTRE CLIENT VPN VyOS+PORT DU WAF
    }
}
